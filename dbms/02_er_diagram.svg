<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#f8fafc"/>
  <text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">FACON FITNESS — ER DIAGRAM</text>

  <!-- logs -->
  <rect x="100" y="120" width="350" height="400" rx="12" fill="white" stroke="#2563eb" stroke-width="3"/>
  <rect x="100" y="120" width="350" height="55" rx="12" fill="#2563eb"/>
  <text x="275" y="155" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">LOGS</text>
  <g font-family="Arial" font-size="18" fill="#1e293b">
    <text x="130" y="215">PK  id : VARCHAR(255)</text>
    <text x="130" y="255">date : VARCHAR(50)</text>
    <text x="130" y="295">food : TEXT</text>
    <text x="130" y="335">calories : INTEGER</text>
    <text x="130" y="375">protein : INTEGER</text>
    <text x="130" y="415">carbs : INTEGER</text>
    <text x="130" y="455">fats : INTEGER</text>
    <text x="130" y="495">water_ml : INTEGER (DEFAULT 0)</text>
  </g>

  <!-- goals -->
  <rect x="550" y="120" width="350" height="400" rx="12" fill="white" stroke="#059669" stroke-width="3"/>
  <rect x="550" y="120" width="350" height="55" rx="12" fill="#059669"/>
  <text x="725" y="155" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">GOALS</text>
  <g font-family="Arial" font-size="18" fill="#1e293b">
    <text x="580" y="215">PK  id : VARCHAR(255)</text>
    <text x="580" y="255">date : VARCHAR(50)</text>
    <text x="580" y="295">text : TEXT</text>
    <text x="580" y="335">completed : BOOLEAN (DEFAULT FALSE)</text>
    <text x="580" y="375">priority : VARCHAR(20) (DEFAULT medium)</text>
    <text x="580" y="415">created_at : TIMESTAMP</text>
  </g>

  <text x="500" y="565" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Independent entities — no foreign-key relationship</text>
</svg>
